<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动画系统测试 - Clicker Quest</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .test-container {
            padding: 20px;
            text-align: center;
        }
        
        .test-section {
            margin: 30px 0;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
        }
        
        .test-section h3 {
            margin-bottom: 15px;
            color: var(--color-primary);
        }
        
        .test-btn {
            margin: 10px;
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--color-primary) 0%, #FFA500 100%);
            border: none;
            border-radius: 8px;
            color: var(--color-background);
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .test-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }
        
        .test-btn:active {
            transform: scale(0.95);
        }
        
        .number-display {
            font-family: var(--font-number);
            font-size: 48px;
            color: var(--color-primary);
            margin: 20px 0;
        }
        
        .click-test-area {
            width: 200px;
            height: 200px;
            margin: 20px auto;
            background: radial-gradient(circle, #FFD700 0%, #FFA500 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            cursor: pointer;
            transition: all 0.1s ease;
            border: 4px solid #B8860B;
            box-shadow: 0 8px 32px rgba(255, 215, 0, 0.4);
        }
        
        .click-test-area:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div class="screen active" id="test-screen">
            <div class="status-bar">
                <div class="game-logo">动画测试</div>
            </div>
            
            <div class="test-container">
                <!-- 金币飘字测试 -->
                <div class="test-section">
                    <h3>金币飘字动画</h3>
                    <button class="test-btn" onclick="testGoldFloat()">普通金币</button>
                    <button class="test-btn" onclick="testGoldFloatSmall()">小暴击</button>
                    <button class="test-btn" onclick="testGoldFloatMedium()">中暴击</button>
                    <button class="test-btn" onclick="testGoldFloatLarge()">大暴击</button>
                </div>
                
                <!-- 暴击特效测试 -->
                <div class="test-section">
                    <h3>暴击特效</h3>
                    <button class="test-btn" onclick="testCriticalSmall()">小暴击特效</button>
                    <button class="test-btn" onclick="testCriticalMedium()">中暴击特效</button>
                    <button class="test-btn" onclick="testCriticalLarge()">大暴击特效</button>
                </div>
                
                <!-- 屏幕震动测试 -->
                <div class="test-section">
                    <h3>屏幕震动</h3>
                    <button class="test-btn" onclick="testShake(10)">轻微震动</button>
                    <button class="test-btn" onclick="testShake(20)">中等震动</button>
                    <button class="test-btn" onclick="testShake(40)">强烈震动</button>
                </div>
                
                <!-- 数值变化测试 -->
                <div class="test-section">
                    <h3>数值变化动画</h3>
                    <div class="number-display" id="test-number">0</div>
                    <button class="test-btn" onclick="testNumberChange()">数值滚动</button>
                </div>
                
                <!-- 按钮点击测试 -->
                <div class="test-section">
                    <h3>按钮点击动画</h3>
                    <div class="click-test-area" onclick="testButtonClick(event)">🪙</div>
                    <p style="color: var(--color-text-secondary); margin-top: 10px;">点击金币测试动画</p>
                </div>
                
                <!-- 金币飞行测试 -->
                <div class="test-section">
                    <h3>金币飞行动画</h3>
                    <button class="test-btn" onclick="testCoinFly()">金币飞行</button>
                </div>
                
                <!-- 粒子效果测试 -->
                <div class="test-section">
                    <h3>粒子效果</h3>
                    <button class="test-btn" onclick="testParticles('burst')">爆发粒子</button>
                    <button class="test-btn" onclick="testParticles('fountain')">喷泉粒子</button>
                    <button class="test-btn" onclick="testParticles('rain')">雨滴粒子</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 引入脚本 -->
    <script src="js/core/EventBus.js"></script>
    <script src="js/ui/AnimationManager.js"></script>
    <script>
        // 初始化
        const eventBus = new EventBus();
        const animationManager = new AnimationManager(eventBus);
        
        // 测试变量
        let testNumber = 0;
        
        // 金币飘字测试
        function testGoldFloat() {
            const position = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
            animationManager.playGoldFloat(100, position, 'normal');
        }
        
        function testGoldFloatSmall() {
            const position = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
            animationManager.playGoldFloat(200, position, 'critical-small');
        }
        
        function testGoldFloatMedium() {
            const position = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
            animationManager.playGoldFloat(500, position, 'critical-medium');
        }
        
        function testGoldFloatLarge() {
            const position = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
            animationManager.playGoldFloat(1000, position, 'critical-large');
        }
        
        // 暴击特效测试
        function testCriticalSmall() {
            const position = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
            animationManager.playCriticalEffect('small', position);
        }
        
        function testCriticalMedium() {
            const position = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
            animationManager.playCriticalEffect('medium', position);
        }
        
        function testCriticalLarge() {
            const position = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
            animationManager.playCriticalEffect('large', position);
        }
        
        // 屏幕震动测试
        function testShake(intensity) {
            animationManager.playScreenShake(intensity, intensity * 3);
        }
        
        // 数值变化测试
        function testNumberChange() {
            const element = document.getElementById('test-number');
            const from = testNumber;
            const to = testNumber + Math.floor(Math.random() * 1000) + 100;
            testNumber = to;
            
            animationManager.playNumberChange(element, from, to, 500);
        }
        
        // 按钮点击测试
        function testButtonClick(event) {
            const target = event.currentTarget;
            animationManager.playButtonClick(target);
            
            // 同时显示金币飘字
            const rect = target.getBoundingClientRect();
            const position = {
                x: rect.left + rect.width / 2,
                y: rect.top
            };
            animationManager.playGoldFloat(Math.floor(Math.random() * 100) + 10, position);
        }
        
        // 金币飞行测试
        function testCoinFly() {
            const from = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
            const to = { x: 100, y: 100 };
            animationManager.createCoinFlyAnimation(from, to, 10, () => {
                console.log('金币飞行完成');
            });
        }
        
        // 粒子效果测试
        function testParticles(type) {
            const position = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
            animationManager.playParticles({
                position: position,
                count: 20,
                color: '#FFD700',
                type: type
            });
        }
        
        // 测试事件监听
        eventBus.on('animation:goldFloat', (data) => {
            console.log('金币飘字动画:', data);
        });
        
        eventBus.on('animation:critical', (data) => {
            console.log('暴击特效:', data);
        });
    </script>
</body>
</html>
