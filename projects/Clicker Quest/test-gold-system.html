<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金币系统测试 - Clicker Quest</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        
        h2 {
            margin: 20px 0 15px;
            color: #4fc3f7;
            border-bottom: 2px solid #4fc3f7;
            padding-bottom: 10px;
        }
        
        .test-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .test-item {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 10px;
        }
        
        .test-item.success {
            border-left: 4px solid #4caf50;
        }
        
        .test-item.fail {
            border-left: 4px solid #f44336;
        }
        
        .test-name {
            font-weight: bold;
            margin-bottom: 5px;
            color: #fff;
        }
        
        .test-result {
            font-size: 14px;
            color: #b0bec5;
        }
        
        .test-result .expected {
            color: #81c784;
        }
        
        .test-result .actual {
            color: #ffb74d;
        }
        
        .test-result .pass {
            color: #4caf50;
            font-weight: bold;
        }
        
        .test-result .fail {
            color: #f44336;
            font-weight: bold;
        }
        
        .stats {
            background: rgba(255, 215, 0, 0.1);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .stats-item {
            display: inline-block;
            margin: 0 20px;
        }
        
        .stats-value {
            font-size: 32px;
            font-weight: bold;
            color: #ffd700;
        }
        
        .stats-label {
            font-size: 14px;
            color: #b0bec5;
        }
        
        .gold-display {
            background: linear-gradient(135deg, #ffd700 0%, #ffaa00 100%);
            color: #1a1a2e;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.3);
        }
        
        .gold-value {
            font-size: 48px;
            font-weight: bold;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
        
        .gold-label {
            font-size: 16px;
            margin-top: 5px;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        
        button {
            background: linear-gradient(135deg, #4fc3f7 0%, #29b6f6 100%);
            color: #fff;
            border: none;
            border-radius: 5px;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(79, 195, 247, 0.3);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button.danger {
            background: linear-gradient(135deg, #f44336 0%, #e53935 100%);
        }
        
        button.success {
            background: linear-gradient(135deg, #4caf50 0%, #43a047 100%);
        }
        
        .console {
            background: #000;
            border-radius: 5px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        
        .console-line {
            margin-bottom: 5px;
        }
        
        .console-line.info {
            color: #4fc3f7;
        }
        
        .console-line.success {
            color: #4caf50;
        }
        
        .console-line.error {
            color: #f44336;
        }
        
        .console-line.warn {
            color: #ff9800;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>金币系统测试</h1>
        
        <!-- 金币显示 -->
        <div class="gold-display">
            <div class="gold-value" id="goldValue">0</div>
            <div class="gold-label">当前金币</div>
        </div>
        
        <!-- 统计信息 -->
        <div class="stats">
            <div class="stats-item">
                <div class="stats-value" id="totalEarned">0</div>
                <div class="stats-label">累计获得</div>
            </div>
            <div class="stats-item">
                <div class="stats-value" id="totalSpent">0</div>
                <div class="stats-label">累计消耗</div>
            </div>
            <div class="stats-item">
                <div class="stats-value" id="multiplier">1x</div>
                <div class="stats-label">全局倍率</div>
            </div>
        </div>
        
        <!-- 控制按钮 -->
        <div class="controls">
            <button onclick="testAddGold()">增加100金币</button>
            <button onclick="testAddLargeGold()">增加1M金币</button>
            <button onclick="testSpendGold()">消耗50金币</button>
            <button onclick="testSetMultiplier()">设置2x倍率</button>
            <button onclick="testReset()" class="danger">重置金币</button>
            <button onclick="runAllTests()" class="success">运行所有测试</button>
        </div>
        
        <!-- 测试结果 -->
        <div id="testResults"></div>
        
        <!-- 控制台 -->
        <h2>控制台输出</h2>
        <div class="console" id="console"></div>
    </div>

    <!-- 加载依赖 -->
    <script src="config/game.config.js"></script>
    <script src="js/core/EventBus.js"></script>
    <script src="js/utils/NumberFormatter.js"></script>
    <script src="js/core/GoldManager.js"></script>
    
    <script>
        // 创建全局实例
        let eventBus;
        let goldManager;
        let testResults = [];
        
        // 初始化
        function init() {
            eventBus = new EventBus();
            goldManager = new GoldManager(eventBus, null);
            
            // 监听金币事件
            eventBus.on(GameEvents.GOLD_CHANGED, (data) => {
                log(`金币变化: ${goldManager.formatGold(data.oldGold)} -> ${goldManager.formatGold(data.newGold)}`, 'info');
                updateDisplay();
            });
            
            eventBus.on(GameEvents.GOLD_EARNED, (data) => {
                log(`获得金币: +${goldManager.formatGold(data.amount)} (来源: ${data.source})`, 'success');
            });
            
            eventBus.on(GameEvents.GOLD_SPENT, (data) => {
                log(`消耗金币: -${goldManager.formatGold(data.amount)} (用途: ${data.purpose})`, 'warn');
            });
            
            updateDisplay();
            log('金币系统初始化完成', 'success');
        }
        
        // 更新显示
        function updateDisplay() {
            document.getElementById('goldValue').textContent = goldManager.formatGold(goldManager.getCurrentGold());
            document.getElementById('totalEarned').textContent = goldManager.formatGold(goldManager.getTotalGoldEarned());
            document.getElementById('totalSpent').textContent = goldManager.formatGold(goldManager.getTotalGoldSpent());
            document.getElementById('multiplier').textContent = goldManager.getGlobalMultiplier() + 'x';
        }
        
        // 日志输出
        function log(message, type = 'info') {
            const consoleEl = document.getElementById('console');
            const line = document.createElement('div');
            line.className = `console-line ${type}`;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            consoleEl.appendChild(line);
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }
        
        // 测试函数
        function testAddGold() {
            goldManager.addGold(100, GoldSource.MANUAL_CLICK);
        }
        
        function testAddLargeGold() {
            goldManager.addGold(1000000, GoldSource.AUTO_CLICKER);
        }
        
        function testSpendGold() {
            const success = goldManager.spendGold(50, GoldPurpose.UPGRADE_CLICK);
            if (!success) {
                log('金币不足，无法消耗', 'error');
            }
        }
        
        function testSetMultiplier() {
            goldManager.setGlobalMultiplier(2);
            updateDisplay();
        }
        
        function testReset() {
            goldManager.reset();
            updateDisplay();
        }
        
        // 运行所有测试
        function runAllTests() {
            testResults = [];
            const resultsEl = document.getElementById('testResults');
            resultsEl.innerHTML = '';
            
            log('========== 开始运行测试 ==========', 'info');
            
            // 测试 NumberFormatter
            testNumberFormatter();
            
            // 测试 GoldManager
            testGoldManager();
            
            // 显示测试结果
            displayTestResults();
            
            // 统计
            const passed = testResults.filter(t => t.passed).length;
            const total = testResults.length;
            log(`========== 测试完成: ${passed}/${total} 通过 ==========`, passed === total ? 'success' : 'warn');
        }
        
        // 测试 NumberFormatter
        function testNumberFormatter() {
            const formatter = new NumberFormatter();
            
            // 测试格式化
            test('NumberFormatter - 小于1000', () => {
                return formatter.format(999) === '999';
            });
            
            test('NumberFormatter - K格式', () => {
                return formatter.format(1500) === '1.50K';
            });
            
            test('NumberFormatter - M格式', () => {
                return formatter.format(1500000) === '1.50M';
            });
            
            test('NumberFormatter - B格式', () => {
                return formatter.format(1500000000) === '1.50B';
            });
            
            test('NumberFormatter - T格式', () => {
                return formatter.format(1500000000000) === '1.50T';
            });
            
            test('NumberFormatter - 科学计数法', () => {
                const result = formatter.format(1e15);
                return result.includes('e');
            });
            
            test('NumberFormatter - 负数', () => {
                return formatter.format(-1000) === '-1.00K';
            });
            
            test('NumberFormatter - 零', () => {
                return formatter.format(0) === '0';
            });
            
            test('NumberFormatter - parse K', () => {
                return formatter.parse('1.5K') === 1500;
            });
            
            test('NumberFormatter - parse M', () => {
                return formatter.parse('2.5M') === 2500000;
            });
            
            test('NumberFormatter - formatDPS', () => {
                return formatter.formatDPS(1000) === '+1.00K';
            });
            
            test('NumberFormatter - formatPercent', () => {
                return formatter.formatPercent(50.5) === '50.5%';
            });
        }
        
        // 测试 GoldManager
        function testGoldManager() {
            // 重置状态
            goldManager.reset();
            
            // 测试初始状态
            test('GoldManager - 初始金币为0', () => {
                return goldManager.getCurrentGold() === 0;
            });
            
            // 测试增加金币
            test('GoldManager - 增加金币', () => {
                const added = goldManager.addGold(100, GoldSource.MANUAL_CLICK);
                return added === 100 && goldManager.getCurrentGold() === 100;
            });
            
            // 测试累计获得
            test('GoldManager - 累计获得', () => {
                return goldManager.getTotalGoldEarned() === 100;
            });
            
            // 测试消耗金币
            test('GoldManager - 消耗金币', () => {
                const success = goldManager.spendGold(50, GoldPurpose.UPGRADE_CLICK);
                return success && goldManager.getCurrentGold() === 50;
            });
            
            // 测试累计消耗
            test('GoldManager - 累计消耗', () => {
                return goldManager.getTotalGoldSpent() === 50;
            });
            
            // 测试金币不足
            test('GoldManager - 金币不足', () => {
                return !goldManager.spendGold(100, GoldPurpose.BUY_ITEM);
            });
            
            // 测试全局倍率
            test('GoldManager - 全局倍率', () => {
                goldManager.setGlobalMultiplier(2);
                const added = goldManager.addGold(100, GoldSource.AUTO_CLICKER);
                return added === 200 && goldManager.getCurrentGold() === 250;
            });
            
            // 测试格式化
            test('GoldManager - 格式化金币', () => {
                goldManager.addGold(1000000, GoldSource.AUTO_CLICKER);
                const formatted = goldManager.formatGold(goldManager.getCurrentGold());
                return formatted.includes('M');
            });
            
            // 测试存档数据
            test('GoldManager - 存档数据', () => {
                const saveData = goldManager.getSaveData();
                return saveData.currentGold !== undefined && 
                       saveData.totalGoldEarned !== undefined &&
                       saveData.totalGoldSpent !== undefined;
            });
            
            // 测试加载存档
            test('GoldManager - 加载存档', () => {
                const testData = {
                    currentGold: 1000,
                    totalGoldEarned: 5000,
                    totalGoldSpent: 4000,
                    globalMultiplier: 1.5
                };
                goldManager.loadSaveData(testData);
                return goldManager.getCurrentGold() === 1000 &&
                       goldManager.getGlobalMultiplier() === 1.5;
            });
            
            // 测试重置
            test('GoldManager - 重置', () => {
                goldManager.reset();
                return goldManager.getCurrentGold() === 0 &&
                       goldManager.getTotalGoldEarned() === 0 &&
                       goldManager.getTotalGoldSpent() === 0;
            });
        }
        
        // 测试辅助函数
        function test(name, testFn) {
            let passed = false;
            let error = null;
            
            try {
                passed = testFn();
            } catch (e) {
                error = e.message;
            }
            
            testResults.push({
                name: name,
                passed: passed,
                error: error
            });
            
            log(`测试: ${name} - ${passed ? '通过' : '失败'}`, passed ? 'success' : 'error');
        }
        
        // 显示测试结果
        function displayTestResults() {
            const resultsEl = document.getElementById('testResults');
            let html = '<h2>测试结果</h2>';
            
            testResults.forEach(result => {
                html += `
                    <div class="test-item ${result.passed ? 'success' : 'fail'}">
                        <div class="test-name">${result.name}</div>
                        <div class="test-result">
                            <span class="${result.passed ? 'pass' : 'fail'}">${result.passed ? '通过' : '失败'}</span>
                            ${result.error ? `<br>错误: ${result.error}` : ''}
                        </div>
                    </div>
                `;
            });
            
            resultsEl.innerHTML = html;
        }
        
        // 页面加载完成后初始化
        window.addEventListener('load', init);
    </script>
</body>
</html>
