<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Clicker Quest - 点击放置类游戏">
    <title>Clicker Quest</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 游戏容器 -->
    <div id="game-container">
        <!-- 主界面 -->
        <div id="main-screen" class="screen active">
            <!-- 状态栏 -->
            <header class="status-bar">
                <button id="settings-btn" class="icon-btn" aria-label="设置">
                    <span class="icon">⚙️</span>
                </button>
                <h1 class="game-logo">Clicker Quest</h1>
                <button id="leaderboard-btn" class="icon-btn" aria-label="排行榜">
                    <span class="icon">🏆</span>
                </button>
            </header>

            <!-- 金币显示区域 -->
            <section class="gold-display">
                <div class="gold-amount">
                    <span class="gold-icon">💰</span>
                    <span id="gold-value" class="gold-value">0</span>
                </div>
                <div class="dps-display">
                    <span class="dps-label">金币/秒:</span>
                    <span id="dps-value" class="dps-value">+0</span>
                </div>
            </section>

            <!-- 核心交互区域 -->
            <section class="click-area">
                <button id="main-coin" class="coin-btn" aria-label="点击获取金币">
                    <img src="https://liblibai-tmp-image.liblib.cloud/img/2b9c3b138eb5459ca282cbe6f6a8b2c6/2b467f1e13b620520dc2840694c62ad38e9b1ef1c11c40671044848f591a38aa.png" alt="点击角色" class="character-img">
                    <span class="coin-visual">🪙</span>
                </button>
                <p class="click-hint">点击获取金币</p>
            </section>

            <!-- BUFF状态栏 -->
            <section class="buff-bar" id="buff-bar">
                <!-- 动态生成BUFF图标 -->
            </section>

            <!-- 底部导航栏 -->
            <nav class="bottom-nav">
                <button class="nav-btn active" data-screen="shop">
                    <span class="nav-icon">🏪</span>
                    <span class="nav-label">商店</span>
                </button>
                <button class="nav-btn" data-screen="achievement">
                    <span class="nav-icon">🏆</span>
                    <span class="nav-label">成就</span>
                </button>
                <button class="nav-btn" data-screen="inventory">
                    <span class="nav-icon">🎒</span>
                    <span class="nav-label">道具</span>
                </button>
            </nav>
        </div>

        <!-- 商店界面 -->
        <div id="shop-screen" class="screen">
            <!-- 商店内容将由UIManager动态生成 -->
        </div>

        <!-- 成就界面 -->
        <div id="achievement-screen" class="screen">
            <!-- 成就内容将由UIManager动态生成 -->
        </div>

        <!-- 道具界面 -->
        <div id="inventory-screen" class="screen">
            <!-- 道具内容将由UIManager动态生成 -->
        </div>

        <!-- 设置界面 -->
        <div id="settings-screen" class="screen">
            <!-- 设置内容将由UIManager动态生成 -->
        </div>

        <!-- 排行榜界面 -->
        <div id="leaderboard-screen" class="screen">
            <!-- 排行榜内容将由UIManager动态生成 -->
        </div>
    </div>

    <!-- 弹窗容器 -->
    <div id="modal-container"></div>

    <!-- 金币飘字容器 -->
    <div id="floating-text-container"></div>

    <!-- 游戏配置 -->
    <script src="config/game.config.js"></script>
    
    <!-- 系统模块（先加载，定义枚举和基础类） -->
    <script src="js/systems/CriticalHitSystem.js"></script>
    <script src="js/systems/DPSManager.js"></script>
    <script src="js/systems/OfflineRewardSystem.js"></script>
    
    <!-- 核心模块 -->
    <script src="js/core/EventBus.js"></script>
    <script src="js/core/GoldManager.js"></script>
    <script src="js/core/ClickManager.js"></script>
    <script src="js/core/ShopManager.js"></script>
    <script src="js/core/ItemManager.js"></script>
    <script src="js/core/AchievementManager.js"></script>
    <script src="js/core/SaveManager.js"></script>
    <script src="js/core/GameManager.js"></script>
    
    <!-- UI模块 -->
    <script src="js/ui/UIManager.js"></script>
    <script src="js/ui/MainScreenUI.js"></script>
    <script src="js/ui/ShopScreenUI.js"></script>
    <script src="js/ui/AchievementScreenUI.js"></script>
    <script src="js/ui/ModalManager.js"></script>
    <script src="js/ui/AnimationManager.js"></script>
    
    <!-- 工具模块 -->
    <script src="js/utils/NumberFormatter.js"></script>
    <script src="js/utils/TimeFormatter.js"></script>
    <script src="js/utils/StorageHelper.js"></script>
    <script src="js/utils/AudioHelper.js"></script>
    
    <!-- 主入口 -->
    <script src="js/main.js"></script>
</body>
</html>
